apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Demo para la campaña: ./gradlew -Pdemo android:assembleDebug (el CI además crea assets/demo.flag).
def demo = project.hasProperty('demo')

android {
  namespace 'cl.xiombo.faro'
  compileSdk 35

  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.srcDirs = ['src/main/kotlin']
      res.srcDirs = ['res']
      assets.srcDirs = ['../assets']
      jniLibs.srcDirs = ['libs']
    }
  }

  defaultConfig {
    // La demo se instala aparte de la versión completa.
    applicationId demo ? 'cl.xiombo.faro.demo' : 'cl.xiombo.faro'
    manifestPlaceholders = [appLabel: demo ? 'Faro Hundido Demo' : 'Faro Hundido']
    minSdk 24
    targetSdk 35
    // En el CI cada build sube el número, así una APK nueva se instala encima de la anterior.
    versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
    versionName demo ? '0.1.0-demo' : '0.1.0-f0'
  }

  // Keystore de desarrollo fija: así cada APK del CI se instala encima del anterior.
  // La APK de la demo se firma con la llave propia del juego, que vive solo como secreto del CI
  // (FARO_KEYSTORE y compañía) y nunca en el repo. Sin esa llave se usa la de desarrollo.
  def releaseKeystore = System.getenv('FARO_KEYSTORE')
  signingConfigs {
    dev {
      storeFile file('debug.keystore')
      storePassword 'android'
      keyAlias 'androiddebugkey'
      keyPassword 'android'
    }
    if (releaseKeystore) {
      release {
        storeFile file(releaseKeystore)
        storePassword System.getenv('FARO_KEYSTORE_PASSWORD')
        keyAlias System.getenv('FARO_KEY_ALIAS')
        keyPassword System.getenv('FARO_KEY_PASSWORD')
      }
    }
  }

  lint {
    checkReleaseBuilds false
    abortOnError false
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.dev
    }
    release {
      minifyEnabled false
      signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.dev
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}

configurations { natives }

dependencies {
  implementation project(':core')
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  implementation "com.badlogicgames.gdx-controllers:gdx-controllers-android:$controllersVersion"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
}

// Copia las librerías nativas de libGDX (.so) a libs/<abi> antes de empaquetar.
tasks.register('copyAndroidNatives') {
  doFirst {
    configurations.natives.files.each { jar ->
      def outputDir = null
      if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
      if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
      if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
      if (jar.name.endsWith('natives-x86.jar')) outputDir = file('libs/x86')
      if (outputDir != null) {
        copy {
          from zipTree(jar)
          into outputDir
          include '*.so'
        }
      }
    }
  }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach { t ->
  t.dependsOn 'copyAndroidNatives'
}
