name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (Android) y JAR (PC)
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon android:assembleDebug lwjgl3:jar 2>&1 | tee build.log

      # Resume los errores como anotación para leerlos sin abrir el log completo.
      - name: Resumen de errores
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|^> |Could not" -A2 build.log | grep -vE "^\s+at |^> Task" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build fallido::${msg}"

      - name: Preparar archivos
        run: |
          mkdir -p dist
          cp android/build/outputs/apk/debug/android-debug.apk dist/FaroHundido.apk
          cp lwjgl3/build/libs/FaroHundido-*.jar dist/FaroHundido.jar
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: faro-hundido-${{ github.sha }}
          path: dist/

      # Release "dev" siempre apunta al último build: el link de descarga no cambia.
      - name: Publicar release dev
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev dist/FaroHundido.apk dist/FaroHundido.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Build de desarrollo" \
            --notes "Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
